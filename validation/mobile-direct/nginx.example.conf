# 독립 정적 HTTPS 호스트용 예시입니다. 실제 서버에 적용하지 않았습니다.
# 사용자가 server_name, 인증서 경로, root를 검토하여 바꾼 뒤 적용합니다.
# root에는 index.html, styles.css, app.mjs, probe.mjs 네 파일만 배포합니다.
# README, 테스트, 소스 저장소, SHA256SUMS, .env, TLS 개인키는 공개하지 않습니다.
# Meta 요청은 휴대폰에서 직접 실행합니다. proxy_pass/API/업로드 경로를 추가하지 않습니다.

server {
    listen 443 ssl;
    server_name mobile-probe.example.com;

    ssl_certificate /etc/letsencrypt/live/mobile-probe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile-probe.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/threads-mobile-direct;
    autoindex off;
    charset utf-8;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript mjs;
    }

    # 앞단 CDN/WAF/별도 로깅의 정책은 별도로 확인합니다.
    access_log off;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://graph.threads.com; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # return만 사용하는 조건입니다. 요청 본문을 처리하지 않습니다.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    if ($args != "") {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /styles.css {
        try_files $uri =404;
    }
    location = /app.mjs {
        try_files $uri =404;
    }
    location = /probe.mjs {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
