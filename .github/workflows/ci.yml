name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - run: pnpm install --frozen-lockfile
      - name: Prepare Windows app runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/prepare-windows-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TMM_PYTHON=$((Resolve-Path build/runtime/python/python.exe).Path)" >> $env:GITHUB_ENV
          "$((Resolve-Path build/runtime/bin).Path)" >> $env:GITHUB_PATH
      - name: Prepare Mac test dependencies
        if: runner.os == 'macOS'
        run: |
          python -m pip install -r local-runtime/requirements.txt
          echo "TMM_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Verify test dependencies
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Lint, types and formatting
        run: pnpm lint && pnpm typecheck && pnpm format:check
      - name: TypeScript tests
        id: typescript
        continue-on-error: true
        run: pnpm test
      - name: Build Windows installer candidate
        id: package
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pnpm make --arch=x64
      - name: Verify packaged runtime and installer outputs
        id: packaged_runtime
        if: runner.os == 'Windows' && steps.package.outcome == 'success'
        continue-on-error: true
        run: pnpm verify:windows
      - name: Save packaged Windows UI evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: threads-media-manager-windows-ui-${{ github.sha }}
          path: out/windows-ui-smoke.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Python tests
        id: python
        continue-on-error: true
        run: pnpm test:python
      - name: Require tests and Windows package verification to pass
        env:
          TYPESCRIPT_RESULT: ${{ steps.typescript.outcome }}
          PYTHON_RESULT: ${{ steps.python.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          RUNTIME_RESULT: ${{ steps.packaged_runtime.outcome }}
        run: >-
          node -e "const e = process.env;
          const results = [e.TYPESCRIPT_RESULT, e.PYTHON_RESULT];
          if (process.platform === 'win32') results.push(e.PACKAGE_RESULT, e.RUNTIME_RESULT);
          if (results.some(result => result !== 'success')) process.exit(1)"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: threads-media-manager-windows-candidate-${{ github.sha }}
          path: out/make/squirrel.windows/x64/
          if-no-files-found: error
          retention-days: 14
